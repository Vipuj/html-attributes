<!DOCTYPE html>
<html>
<head>
    <title>HTML Attributes</title>
</head>
<body>

    <!-- title gives extra information when the mouse is placed over an element -->
    <p title="This is extra information">Move your mouse over this text.</p>

    <!-- href specifies the destination of a link -->
    <a href="https://www.google.com">Visit Google</a>

    <!-- target specifies where the linked page opens -->
    <a href="https://www.google.com" target="_blank">Open Google in a new tab</a>

    <!-- id gives an element a unique identifier -->
    <p id="intro">This paragraph has an id.</p>

    <!-- class groups elements so they can be selected and styled -->
    <p class="note">This paragraph has a class.</p>

</body>
</html>
